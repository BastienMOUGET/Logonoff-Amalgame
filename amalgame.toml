
[package]
name = "logonoff"
version = "0.1.0"
license = "Apache-2.0"
description = "Logonoff — presence and per-project time tracking from Windows session events (service + local web UI)."
entry = "src/main.am"

[dependencies]

[dependencies.crypto]
git = "github.com/amalgame-lang/amalgame-crypto"
tag = "v0.8.0"

[dependencies.async]
git = "github.com/amalgame-lang/amalgame-async"
tag = "v0.4.1"

[dependencies.tls]
git = "github.com/amalgame-lang/amalgame-tls"
tag = "v0.3.6"

[dependencies.http]
git = "github.com/amalgame-lang/amalgame-net-http"
tag = "v0.30.0"

[dependencies.threading]
git = "github.com/amalgame-lang/amalgame-threading"
tag = "v0.1.0"

[dependencies.sqlite]
git = "github.com/amalgame-lang/amalgame-database-sqlite"
tag = "v0.4.0"

[dependencies.datetime]
git = "github.com/amalgame-lang/amalgame-datetime"
tag = "v0.3.0"

[dependencies.service]
git = "github.com/amalgame-lang/amalgame-service"
tag = "v0.3.0"

[dependencies.xlsx]
git = "github.com/amalgame-lang/amalgame-formats-xlsx"
tag = "v0.1.0"
